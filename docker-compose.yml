services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=unimarket
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  migration:
    build: .
    image: unimarket-cunoc-poc:local
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/unimarket
      - DB_SSL=false
    depends_on:
      db:
        condition: service_healthy
    command: ["node", "scripts/migrate.js"]

  api:
    build: .
    image: unimarket-cunoc-poc:local
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DATABASE_URL=postgres://postgres:postgres@db:5432/unimarket
      - DB_SSL=false
    depends_on:
      migration:
        condition: service_completed_successfully

volumes:
  db-data:
